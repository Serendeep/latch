[package]
name = "latch-core"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
bindings = ["dep:ts-rs"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
ts-rs = { version = "=12.0.1", optional = true }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "=0.4.3"
zeroize = { workspace = true, features = ["serde"] }

[target.'cfg(unix)'.dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
rustix = { version = "=1.1.4", features = ["process", "fs", "net"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=5.2.0", features = ["rt-async-io-crypto-rust"] }
zbus = { version = "=5.19.0", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = "=3.27.0"

[[example]]
name = "export_bindings"
required-features = ["bindings"]

[lints]
workspace = true
