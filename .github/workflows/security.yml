name: Security checks
on:
  push:
  pull_request:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "2"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
      - run: python3 tests/test_scanner_install.py
      - name: Install checksum-verified scanner
        run: python3 scripts/install_gitleaks.py "$RUNNER_TEMP/latch-tools"
      - name: Scan history with complete value redaction
        run: '"$RUNNER_TEMP/latch-tools/gitleaks" git --redact=100 --no-banner .'
