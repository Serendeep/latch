[workspace]
members = ["crates/core", "crates/cli", "apps/desktop/src-tauri"]
default-members = ["crates/core", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"

[workspace.dependencies]
latch-core = { path = "crates/core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
